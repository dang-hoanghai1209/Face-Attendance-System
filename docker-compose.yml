services:
  postgres:
    image: postgres:16
    container_name: face_attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: face_attendance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
